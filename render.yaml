services:
  - type: web
    name: visiongate-web
    env: static
    buildCommand: "chmod +x render-build.sh && ./render-build.sh"
    staticPublishPath: "./web_build"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: "no-cache"
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
